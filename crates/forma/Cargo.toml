[package]
name = "forma"
version.workspace = true
edition.workspace = true

[[bin]]
name = "forma"
path = "src/main.rs"

[dependencies]
async-lsp = { version = "0.2.4", default-features = false, features = ["stdio", "tokio"] }
forma-core = { path = "../forma-core" }
futures = "0.3"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower-service = "0.3"
